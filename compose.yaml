services:
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: evidencelens-mcp:plan06
    profiles:
      - smoke
    environment:
      EVIDENCELENS_ALLOWED_ROOTS: "course=/workspace"
      EVIDENCELENS_DISABLE_PROVIDER: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none

  review:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${EVIDENCELENS_REVIEW_IMAGE:-evidencelens-mcp:plan06}"
    profiles:
      - review
    environment:
      EVIDENCELENS_ALLOWED_ROOTS: "course=/workspace"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in a project-local .env file or secret source}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}"
      DEEPSEEK_TIMEOUT_MS: "${DEEPSEEK_TIMEOUT_MS:-30000}"
      DEEPSEEK_MAX_RETRIES: "${DEEPSEEK_MAX_RETRIES:-2}"
      DEEPSEEK_MAX_TOTAL_WAIT_MS: "${DEEPSEEK_MAX_TOTAL_WAIT_MS:-10000}"
      DEEPSEEK_TEMPERATURE: "${DEEPSEEK_TEMPERATURE:-0.2}"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-4000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  review-file:
    build:
      context: .
      dockerfile: Dockerfile
    image: evidencelens-mcp:plan06
    profiles:
      - review-file
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
    command:
      - EVIDENCELENS_CONFIG_FILE=./.evidencelens.local.json exec /usr/local/bin/docker-entrypoint.sh
    environment:
      EVIDENCELENS_ALLOWED_ROOTS: "course=/workspace"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        # Compose interpolates inactive profiles too; use the documented local
        # filename as a parse-time default, while review-file still fails at
        # mount time if the caller has not supplied a real project-local file.
        source: "${EVIDENCELENS_CONFIG_FILE:-./.evidencelens.local.json}"
        target: /app/.evidencelens.local.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proof:
    build:
      context: .
      dockerfile: Dockerfile.proof
    image: evidencelens-mcp:proof
    profiles:
      - proof
    working_dir: /app
    user: node
    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh
    environment:
      EVIDENCELENS_ALLOWED_ROOTS: "course=/proof-fixtures"
      DEEPSEEK_API_KEY: "${EVIDENCELENS_PROOF_DEEPSEEK_API_KEY:?Set only by the sealed proof launcher}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}"
      DEEPSEEK_TIMEOUT_MS: "${DEEPSEEK_TIMEOUT_MS:-30000}"
      DEEPSEEK_MAX_RETRIES: "0"
      DEEPSEEK_MAX_TOTAL_WAIT_MS: "${DEEPSEEK_MAX_TOTAL_WAIT_MS:-10000}"
      DEEPSEEK_TEMPERATURE: "${DEEPSEEK_TEMPERATURE:-0.2}"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-4000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
